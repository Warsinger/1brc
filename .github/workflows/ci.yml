name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go build -o build/brc ./src/go

  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p build/java
      - run: javac --release 21 -d build/java src/java/*.java
      - run: java -cp build/java CalculateAverageTest

  typescript:
    name: TypeScript (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/ts
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: mkdir -p ../../build/ts
      - run: bun build index.ts --target=bun --outfile=../../build/ts/index.js
      - name: Test the built worker entry point
        run: BRC_ENTRY=../../build/ts/index.js bun test
